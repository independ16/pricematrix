[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  SECRETS_SCAN_OMIT_KEYS = ["SUPABASE_URL"]
[build.environment]
  NODE_VERSION = "18"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200